<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<title>PARKOPS Â· SOLVEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--asfalto:#14171c;--panel:#1c2128;--panel2:#242b34;--linea:#333c48;--tinta:#eef0f3;--tinta2:#9aa5b2;
  --ambar:#ffb300;--verde:#25d366;--rojo:#ff5a5a;--placa:#f5c518;--electro:#3fc9f5;
  --safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--asfalto);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;
  padding-bottom:calc(76px + var(--safe-b));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}

header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:3px solid var(--ambar);
  padding:10px 14px;display:flex;align-items:center;gap:10px}
.icono{width:24px;height:24px;border-radius:5px;flex:none;background:repeating-linear-gradient(135deg,var(--ambar) 0 5px,#14171c 5px 10px)}
header h1{font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-family:'Inter';font-size:11px;color:var(--tinta2);text-transform:none;letter-spacing:0}
header .reloj{margin-left:auto;font-family:'JetBrains Mono';font-size:13px;color:var(--tinta2)}

main{padding:14px;max-width:640px;margin:0 auto}
.vista{display:none}.vista.on{display:block}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:16px;margin-bottom:12px}
.tarjeta h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tarjeta h2 .n{margin-left:auto;font-family:'JetBrains Mono';font-size:12px;color:var(--ambar);
  background:rgba(255,179,0,.13);padding:2px 9px;border-radius:20px}

.placa{background:var(--placa);border:3px solid #0d0f12;border-radius:9px;padding:5px 8px 9px;text-align:center;box-shadow:0 4px 0 #0d0f12}
.placa .pais{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.35em;color:#0d0f12;font-weight:700}
.placa input{width:100%;background:transparent;border:none;text-align:center;font-family:'JetBrains Mono';
  font-weight:700;font-size:clamp(30px,9vw,40px);letter-spacing:.12em;color:#0d0f12;text-transform:uppercase}
.placa input::placeholder{color:rgba(13,15,18,.26)}.placa input:focus{outline:none}
.placa-wrap{position:relative;margin-bottom:14px}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:20;background:var(--panel2);
  border:1px solid var(--linea);border-radius:10px;overflow:hidden;max-height:220px;overflow-y:auto;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.sug button{display:block;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--linea)}
.sug .pl{font-family:'JetBrains Mono';font-weight:700;color:var(--ambar)}
.sug .nm{font-size:12px;color:var(--tinta2)}

label{display:block;font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.08em;font-size:12px;
  color:var(--tinta2);margin-bottom:5px;font-weight:600}
.campo{margin-bottom:12px}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:12px;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ambar);box-shadow:0 0 0 3px rgba(255,179,0,.16)}
.fila{display:flex;gap:10px}.fila>*{flex:1;min-width:0}

.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.tipos button{background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:11px 3px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Barlow Condensed';
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--tinta2)}
.tipos svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.tipos button[aria-pressed=true]{background:rgba(255,179,0,.15);border-color:var(--ambar);color:var(--ambar)}

.switch{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--linea);
  border-radius:10px;padding:12px;margin-bottom:12px;cursor:pointer}
.switch input{width:22px;height:22px;flex:none;accent-color:var(--electro)}
.switch .txt{font-size:14px}
.switch .txt small{display:block;color:var(--tinta2);font-size:12px}
.switch.on{border-color:var(--electro);background:rgba(63,201,245,.09)}
.switch.on .rayo{color:var(--electro)}
.rayo{color:var(--tinta2);flex:none}
.rayo svg{width:22px;height:22px;fill:currentColor}

.btn{display:block;width:100%;padding:16px;border-radius:11px;font-family:'Barlow Condensed';
  text-transform:uppercase;letter-spacing:.07em;font-size:18px;font-weight:700;background:var(--ambar);color:#14171c;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.wa{background:var(--verde);color:#06301a;display:flex;align-items:center;justify-content:center;gap:9px}
.btn.wa svg{width:21px;height:21px;fill:currentColor}
#rPagosApps{display:flex;flex-direction:column;gap:9px}
#rPagosApps:not(:empty){margin-bottom:9px}
.btn.pago{display:flex;align-items:center;justify-content:center;gap:9px}
.btn.pago svg{width:21px;height:21px;flex:none}
.btn.sec{background:var(--panel2);color:var(--tinta);border:1px solid var(--linea);font-size:15px;padding:12px}
.btn.roja{background:transparent;color:var(--rojo);border:1px solid var(--rojo);font-size:14px;padding:11px}
.btn+.btn,.fila+.btn,.btn+.fila{margin-top:9px}

.auto{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--linea);
  border-left:4px solid var(--ambar);border-radius:10px;padding:11px 12px;width:100%;text-align:left;margin-bottom:8px}
.auto .pl{font-family:'JetBrains Mono';font-weight:700;font-size:17px}
.auto .meta{font-size:12px;color:var(--tinta2)}
.auto .t{margin-left:auto;text-align:right;flex:none}
.auto .t b{font-family:'JetBrains Mono';font-size:14px;color:var(--ambar);display:block}
.auto .t span{font-size:11px;color:var(--tinta2)}
.auto.mens{border-left-color:var(--verde)}
.auto.elec{border-left-color:var(--electro)}
.vacio{text-align:center;padding:26px 10px;color:var(--tinta2);font-size:14px}
.vacio b{display:block;font-family:'Barlow Condensed';text-transform:uppercase;font-size:16px;color:var(--tinta);margin-bottom:4px}

.recibo-num{font-family:'JetBrains Mono';font-weight:700;color:var(--ambar);font-size:13px}
.liq{background:var(--panel2);border-radius:12px;padding:18px;text-align:center;margin:14px 0}
.liq .tot{font-family:'JetBrains Mono';font-weight:700;font-size:clamp(34px,11vw,46px);color:var(--verde);line-height:1}
.liq .det{font-size:12px;color:var(--tinta2);margin-top:10px;line-height:1.8;text-align:left}
