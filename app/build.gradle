plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solvex.parkops'
    compileSdk 36

    defaultConfig {
        applicationId "com.solvex.parkops"
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "1.5.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
