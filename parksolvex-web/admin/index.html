<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARKSOLVEX Admin</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f4;background:#14171c}*{box-sizing:border-box}body{margin:0;background:#14171c}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#1c2128;border:1px solid #343b44;border-radius:18px;padding:18px;margin-bottom:16px}.brand{color:#5fd38d;font-weight:900;letter-spacing:.08em}h1,h2{margin:.3rem 0 1rem}label{display:block;color:#a9b2bd;font-size:13px;margin:10px 0 5px}input,select,button{font:inherit;border-radius:10px;padding:11px 12px}input,select{width:100%;background:#11151a;color:#fff;border:1px solid #46505c}button{border:0;background:#5fd38d;color:#0d1710;font-weight:800;cursor:pointer}.secondary{background:#2a313a;color:#fff;border:1px solid #46505c}.danger{background:#7f1d1d;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#a9b2bd}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#263039;color:#b7c0c9;font-size:12px}.ok{color:#69e39b}.err{color:#ff8686}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #343b44;font-size:14px}th{color:#a9b2bd}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:12px}table{display:block;overflow:auto}}
</style></head><body><main class="wrap">
<div class="card"><div class="brand">SOLVEX SYSTEM JB</div><h1>PARKSOLVEX Admin</h1><div id="sessionInfo" class="muted">Portal web de administración del parqueadero</div></div>
<section id="loginCard" class="card"><h2>Ingresar</h2><div class="grid"><div><label>Correo</label><input id="email" type="email" autocomplete="username"></div><div><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="loginBtn" style="margin-top:12px">INGRESAR</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></section>
<section id="app" class="hidden">
<div class="card"><div class="row"><div style="flex:1"><label>Organización / cliente</label><select id="orgSelect"></select></div><button id="refreshBtn" class="secondary">Actualizar</button><button id="logoutBtn" class="secondary">Cerrar sesión</button></div></div>
<div class="grid"><div class="card"><div class="muted">Vehículos en patio</div><h2 id="mPatio">0</h2></div><div class="card"><div class="muted">Usuarios activos</div><h2 id="mUsers">0</h2></div><div class="card"><div class="muted">Mensualidades</div><h2 id="mMens">0</h2></div><div class="card"><div class="muted">Salidas registradas</div><h2 id="mSalidas">0</h2></div></div>
<div class="card"><h2>Crear / invitar usuario</h2><div class="grid"><div><label>Nombre</label><input id="uName"></div><div><label>Correo</label><input id="uEmail" type="email"></div><div><label>Celular</label><input id="uPhone"></div><div><label>Rol</label><select id="uRole"><option value="operador">Operador</option><option value="supervisor">Supervisor</option><option value="admin">Administrador</option><option value="auditor">Auditor</option></select></div></div><button id="inviteBtn" style="margin-top:12px">ENVIAR INVITACIÓN</button><div id="inviteMsg" class="muted" style="margin-top:10px"></div></div>
<div class="card"><h2>Usuarios</h2><div style="overflow:auto"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="usersBody"></tbody></table></div></div>
<div class="card"><h2>Operación reciente</h2><div style="overflow:auto"><table><thead><tr><th>Recibo</th><th>Placa</th><th>Tipo</th><th>Entrada</th><th>Salida</th><th>Valor</th></tr></thead><tbody id="entriesBody"></tbody></table></div></div>
</section>
</main><script type="module" src="./app.js"></script></body></html>
