<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña · SOLVEX</title>
<style>
body{font-family:Arial,sans-serif;background:#14171c;color:#f3f5f7;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#1c2128;border:1px solid #343b44;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin-top:0}.muted{color:#a9b2bd;line-height:1.5}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin-top:10px;font-size:16px}input{background:#11151a;color:white;border:1px solid #46505c}button{border:0;background:#5fd38d;color:#0d1710;font-weight:700;cursor:pointer}.msg{margin-top:14px;min-height:24px}.ok{color:#69e39b}.err{color:#ff8c8c}
</style>
</head>
<body>
<div class="card">
<h1>Nueva contraseña</h1>
<p class="muted">Crea una contraseña nueva para el propietario de SOLVEX Owner License Manager.</p>
<input id="p1" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
<input id="p2" type="password" autocomplete="new-password" placeholder="Confirmar contraseña">
<button id="save">GUARDAR NUEVA CONTRASEÑA</button>
<div id="msg" class="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://epadzsrfsvckyjugcvpd.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_PxFa4vMqovqCIDOwEsoiBQ_2q2jETc_';
const client=supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY);
const msg=document.getElementById('msg');
async function init(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const access=hash.get('access_token'), refresh=hash.get('refresh_token');
  if(access&&refresh){
    const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});
    if(error){msg.textContent='El enlace no es válido o ya venció.';msg.className='msg err';return;}
  }
  const {data}=await client.auth.getSession();
  if(!data.session){msg.textContent='Abre esta página desde el enlace seguro de recuperación.';msg.className='msg err';}
}
document.getElementById('save').onclick=async()=>{
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<8){msg.textContent='Usa una contraseña de al menos 8 caracteres.';msg.className='msg err';return;}
  if(p1!==p2){msg.textContent='Las contraseñas no coinciden.';msg.className='msg err';return;}
  const {error}=await client.auth.updateUser({password:p1});
  if(error){msg.textContent='No se pudo cambiar: '+error.message;msg.className='msg err';return;}
  msg.textContent='Contraseña actualizada. Ya puedes entrar en SOLVEX Owner License Manager.';msg.className='msg ok';
};
init();
</script>
</body>
</html>
