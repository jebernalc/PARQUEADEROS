plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solvex.parkops.owner'
    compileSdk 36

    defaultConfig {
        applicationId "com.solvex.parkops.owner"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
