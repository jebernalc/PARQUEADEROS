name: Build PARKOPS Licensed APK v1.6.4
on:
  workflow_dispatch:
  push:
    branches: [apk-v1.6.0-capacidad]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct immutable v1.5.3 base
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
      - name: Add PARKOPS enhancements
        shell: bash
        run: |
          for f in parkops-v1.5.1.js parkops-v1.6.0.js parkops-v1.6.1.js parkops-v1.6.2.js parkops-v1.6.3.js parkops-v1.6.4.js; do cp web/$f app/src/main/assets/$f; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text()
          files=['parkops-v1.5.1.js','parkops-v1.6.0.js','parkops-v1.6.1.js','parkops-v1.6.2.js','parkops-v1.6.3.js','parkops-v1.6.4.js']
          tag='\n'.join(f'<script src="{x}"></script>' for x in files)
          p.write_text(s.replace('</body>',tag+'\n</body>',1))
          PY
      - name: Validate registration and touch hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="placa"' app/src/main/assets/index.html
          grep -q "N.º DE PARQUEADERO / PUESTO" app/src/main/assets/parkops-v1.6.4.js
          grep -q "MODALIDAD DEL INGRESO" app/src/main/assets/parkops-v1.6.4.js
          grep -q "POR MINUTOS" app/src/main/assets/parkops-v1.6.4.js
          grep -q "TARIFA PLENA · TODO EL DÍA" app/src/main/assets/parkops-v1.6.4.js
          grep -q "TARIFA PLENA · TODA LA NOCHE" app/src/main/assets/parkops-v1.6.4.js
          grep -q "MENSUALIDAD" app/src/main/assets/parkops-v1.6.4.js
          grep -q "CORTESÍA · SIN COBRO" app/src/main/assets/parkops-v1.6.4.js
          grep -q "Cupos de recarga eléctrica" app/src/main/assets/parkops-v1.6.4.js
          grep -q "let scheduled=false" app/src/main/assets/parkops-v1.6.4.js
          grep -q "setTimeout(reconcile,0)" app/src/main/assets/parkops-v1.6.4.js
          grep -q "pointer-events:auto" app/src/main/assets/parkops-v1.6.4.js
          ! grep -q "MutationObserver(()=>.*renderEV" app/src/main/assets/parkops-v1.6.4.js
          grep -q "Bre-B" app/src/main/assets/parkops-v1.5.1.js
          grep -q 'versionName "1.6.4"' app/build.gradle
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' app web
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build installable APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK payload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'parkops-v1.6.4.js'
          unzip -p "$APK" assets/parkops-v1.6.4.js | grep -q 'let scheduled=false'
          unzip -p "$APK" assets/parkops-v1.6.4.js | grep -q 'pointer-events:auto'
          unzip -p "$APK" assets/parkops-v1.6.4.js | grep -q 'MENSUALIDAD'
          unzip -p "$APK" assets/parkops-v1.6.4.js | grep -q 'Cupos de recarga eléctrica'
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.6.4.apk
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.6.4.apk > release/PARKOPS-SOLVEX-LICENSED-v1.6.4.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.6.4
          path: release/
          if-no-files-found: error
