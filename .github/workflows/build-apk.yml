name: Build PARKOPS Licensed APK v1.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct authoritative app source
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
          test "$(wc -c < app/src/main/assets/index.html)" -eq 64455
          rm -f app/src/main/assets/qr_nequi.jpg

      - name: Validate app, privacy and license gate
        shell: bash
        run: |
          grep -q "Registrar ingreso" app/src/main/assets/index.html
          grep -q 'id="celular"' app/src/main/assets/index.html
          grep -q "Recibo por WhatsApp" app/src/main/assets/index.html
          grep -q "id:'nequi'" app/src/main/assets/index.html
          ! grep -q '3114980095' app/src/main/assets/index.html
          ! grep -qi 'qr_nequi.jpg' app/src/main/assets/index.html
          ! grep -qi 'QR Nequi' app/src/main/assets/index.html
          grep -q "Activación PARKOPS" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "if (bridge.hasValidLicense()) loadLicensedApp(); else loadActivationScreen();" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "ANDROID_ID" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "La licencia pertenece a otro dispositivo" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q 'versionName "1.3.0"' app/build.gradle
          test -f licenses/registry.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon

      - name: Verify compiled APK internals
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | sha256sum | grep -q '^ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407'
          ! unzip -Z1 "$APK" | grep -q 'assets/qr_nequi.jpg'
          ! unzip -p "$APK" assets/index.html | grep -q '3114980095'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          FOUND=0
          while read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -q 'Lcom/solvex/parkops/MainActivity;'; then FOUND=1; break; fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$')
          test "$FOUND" -eq 1

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.3.0.apk
          cp tools/license_generator.py release/license_generator.py
          cp keys/solvex_license_public.pem release/solvex_license_public.pem
          cp licenses/registry.json release/license-registry.json
          cp docs/LICENSE-CONTROL.md release/LICENSE-CONTROL.md
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.3.0.apk > release/PARKOPS-SOLVEX-LICENSED-v1.3.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.3.0
          path: release/
          if-no-files-found: error
