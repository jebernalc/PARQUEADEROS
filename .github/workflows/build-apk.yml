name: Build PARKOPS Licensed APK v1.6.6 AUTHORITATIVE
on:
  workflow_dispatch:
  push:
    branches: [apk-v1.6.6-from-authoritative-v1.6.4]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct immutable v1.5.3 base
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
      - name: Add PARKOPS v1.6.4 enhancements
        shell: bash
        run: |
          for f in parkops-v1.5.1.js parkops-v1.6.0.js parkops-v1.6.1.js parkops-v1.6.2.js parkops-v1.6.3.js parkops-v1.6.4.js parkops-v1.6.4-pro.js parkops-v1.6.4-brand-final.js parkops-v1.6.6.js; do cp web/$f app/src/main/assets/$f; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text()
          files=['parkops-v1.5.1.js','parkops-v1.6.0.js','parkops-v1.6.1.js','parkops-v1.6.2.js','parkops-v1.6.3.js','parkops-v1.6.4.js','parkops-v1.6.4-pro.js','parkops-v1.6.4-brand-final.js','parkops-v1.6.6.js']
          tag='\n'.join(f'<script src="{x}"></script>' for x in files)
          p.write_text(s.replace('</body>',tag+'\n</body>',1))
          PY
      - name: Validate authoritative v1.6.4 plus requested v1.6.6 changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="placa"' app/src/main/assets/index.html
          grep -q "N.º DE PARQUEADERO / PUESTO" app/src/main/assets/parkops-v1.6.4.js
          grep -q "MODALIDAD DEL INGRESO" app/src/main/assets/parkops-v1.6.4.js
          grep -q "MENSUALIDAD" app/src/main/assets/parkops-v1.6.4.js
          grep -q "Cupos de recarga eléctrica" app/src/main/assets/parkops-v1.6.4.js
          grep -q "SELECCIÓN DE LIQUIDACIÓN" app/src/main/assets/parkops-v1.6.4-pro.js
          for x in '1 HORA' '2 HORAS' '3 HORAS' '4 HORAS' 'TODO EL DÍA' 'MENSUALIDAD'; do grep -q "$x" app/src/main/assets/parkops-v1.6.4-pro.js; done
          grep -q 'type="file"' app/src/main/assets/parkops-v1.6.4-pro.js
          grep -q "onShowFileChooser" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "ACTION_OPEN_DOCUMENT" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "parkops-header-client-logo" app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q "old.style.display" app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q "aNombre" app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q 'for="logoFile164"' app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q "LOGO PERSONALIZADO DEL CLIENTE · ABRIR GALERÍA" app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q "Abriendo galería" app/src/main/assets/parkops-v1.6.4-brand-final.js
          grep -q "Bre-B" app/src/main/assets/parkops-v1.5.1.js
          grep -q 'versionName "1.6.6"' app/build.gradle
          grep -q 'GUARDA / DEJA CASCO' app/src/main/assets/parkops-v1.6.4.js
          grep -q 'USO DE BAÑO' app/src/main/assets/parkops-v1.6.4.js
          grep -q 'OBSERVACIONES' app/src/main/assets/parkops-v1.6.4.js
          grep -q 'helmetFee165' app/src/main/assets/parkops-v1.6.4-pro.js
          grep -q 'bathroomFee165' app/src/main/assets/parkops-v1.6.4-pro.js
          grep -q 'vatPercent165' app/src/main/assets/parkops-v1.6.4-pro.js
          grep -q 'helmetPrice165' app/src/main/assets/parkops-v1.6.4.js
          grep -q 'bathroomPrice165' app/src/main/assets/parkops-v1.6.4.js
          grep -q 'servicesBreakdown165' app/src/main/assets/parkops-v1.6.5.js
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' app web
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build installable APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK payload
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'parkops-v1.6.4-brand-final.js'
          unzip -p "$APK" assets/parkops-v1.6.4-pro.js | grep -q 'SELECCIÓN DE LIQUIDACIÓN'
          unzip -p "$APK" assets/parkops-v1.6.4-brand-final.js | grep -q 'parkops-header-client-logo'
          unzip -p "$APK" assets/parkops-v1.6.4-brand-final.js | grep -q 'for="logoFile164"'
          unzip -p "$APK" assets/parkops-v1.6.4-brand-final.js | grep -q 'LOGO PERSONALIZADO DEL CLIENTE · ABRIR GALERÍA'
          unzip -p "$APK" assets/parkops-v1.6.5.js | grep -q "base:'authoritative-v1.6.4'"
          unzip -l "$APK" | grep -q 'classes.dex'
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.6.6.apk
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.6.6.apk > release/PARKOPS-SOLVEX-LICENSED-v1.6.6.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.6.6
          path: release/
          if-no-files-found: error