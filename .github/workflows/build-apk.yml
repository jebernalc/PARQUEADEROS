name: Build PARKOPS Licensed APK v1.5.4 IVA Casco Baño
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct immutable authoritative base
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
          test "$(wc -c < app/src/main/assets/index.html)" -eq 64455
          rm -f app/src/main/assets/qr_nequi.jpg
      - name: Add preserved features and v1.5.3 status placement
        shell: bash
        run: |
          cp web/parkops-v1.5.1.js app/src/main/assets/parkops-v1.5.1.js
          cp web/digital-receipts.js app/src/main/assets/digital-receipts.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text(encoding='utf-8');tag='<script src="parkops-v1.5.1.js"></script><script src="digital-receipts.js"></script>';s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+tag;p.write_text(s,encoding='utf-8')
          PY
      - name: Validate preserved app and requested fix only
        shell: bash
        run: |
          grep -q "Registrar ingreso" app/src/main/assets/index.html
          grep -q 'id="celular"' app/src/main/assets/index.html
          grep -q "Recibo por WhatsApp" app/src/main/assets/index.html
          grep -q "Bre-B" app/src/main/assets/parkops-v1.5.1.js
          grep -q "Llave Bre-B" app/src/main/assets/parkops-v1.5.1.js
          grep -q "probeInternet" app/src/main/assets/parkops-v1.5.1.js
          grep -q "generate_204" app/src/main/assets/parkops-v1.5.1.js
          grep -q "findClock" app/src/main/assets/parkops-v1.5.1.js
          grep -q "positionStatus" app/src/main/assets/parkops-v1.5.1.js
          grep -q "● ONLINE" app/src/main/assets/parkops-v1.5.1.js
          grep -q "● OFFLINE" app/src/main/assets/parkops-v1.5.1.js
          grep -q 'versionName "1.5.4"' app/build.gradle
          grep -q 'helmetFee' app/src/main/assets/digital-receipts.js
          grep -q 'bathroomFee' app/src/main/assets/digital-receipts.js
          grep -q 'vatPercent' app/src/main/assets/digital-receipts.js
          grep -q 'Guarda casco' app/src/main/assets/digital-receipts.js
          grep -q 'Uso / ingreso al baño' app/src/main/assets/digital-receipts.js
          ! grep -q '3114980095' app/src/main/assets/index.html
          ! grep -R -q 'BEGIN PRIVATE KEY' app
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle assembleDebug --no-daemon
      - name: Verify compiled APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q "parkops-v1.5.1.js"
          unzip -p "$APK" assets/index.html | grep -q "digital-receipts.js"
          unzip -p "$APK" assets/digital-receipts.js | grep -q "vatPercent"
          unzip -p "$APK" assets/parkops-v1.5.1.js | grep -q "findClock"
          unzip -p "$APK" assets/parkops-v1.5.1.js | grep -q "● ONLINE"
          unzip -p "$APK" assets/parkops-v1.5.1.js | grep -q "● OFFLINE"
          unzip -p "$APK" assets/parkops-v1.5.1.js | grep -q "Bre-B"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.5.4.apk
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.5.4.apk > release/PARKOPS-SOLVEX-LICENSED-v1.5.4.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.5.4
          path: release/
          if-no-files-found: error
