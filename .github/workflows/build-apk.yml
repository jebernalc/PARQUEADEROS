name: Build PARKOPS Licensed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - apk-baseline-license-control-2026-09-06

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate licensed baseline
        shell: bash
        run: |
          test -f app/src/main/assets/index.html
          grep -q "Activación PARKOPS" app/src/main/assets/index.html
          ! grep -qiE 'QR Nequi|id="celular"|id="mCel"|3114980095' app/src/main/assets/index.html
          grep -q "activateLicense" app/src/main/java/com/solvex/parkops/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.1.0.apk
          cp tools/license_generator.py release/license_generator.py
          cp keys/solvex_license_public.pem release/solvex_license_public.pem
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.1.0.apk > release/PARKOPS-SOLVEX-LICENSED-v1.1.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.1.0
          path: release/
          if-no-files-found: error
