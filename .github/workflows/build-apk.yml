name: Build PARKOPS Licensed APK v1.6.2
on:
  workflow_dispatch:
  push:
    branches: [apk-v1.6.0-capacidad]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct immutable v1.5.3 base
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
          test "$(wc -c < app/src/main/assets/index.html)" -eq 64455
      - name: Add preserved features and v1.6.2 enhancements
        shell: bash
        run: |
          cp web/parkops-v1.5.1.js app/src/main/assets/parkops-v1.5.1.js
          cp web/parkops-v1.6.0.js app/src/main/assets/parkops-v1.6.0.js
          cp web/parkops-v1.6.1.js app/src/main/assets/parkops-v1.6.1.js
          cp web/parkops-v1.6.2.js app/src/main/assets/parkops-v1.6.2.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="parkops-v1.5.1.js"></script>\n<script src="parkops-v1.6.0.js"></script>\n<script src="parkops-v1.6.1.js"></script>\n<script src="parkops-v1.6.2.js"></script>'
          s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regression and v1.6.2 validation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Registrar ingreso" app/src/main/assets/index.html
          grep -q "Recibo por WhatsApp" app/src/main/assets/index.html
          grep -q "Liquidar salida" app/src/main/assets/index.html
          grep -q "Cierre de caja" app/src/main/assets/index.html
          grep -q "Bre-B" app/src/main/assets/parkops-v1.5.1.js
          grep -q "capacityOk" app/src/main/assets/parkops-v1.6.0.js
          grep -q "MARCAR SALIDA · LIBERAR CUPO" app/src/main/assets/parkops-v1.6.0.js
          grep -q "Capacidad por tipo de vehículo" app/src/main/assets/parkops-v1.6.1.js
          grep -q "N.º de parqueadero / espacio físico" app/src/main/assets/parkops-v1.6.2.js
          grep -q "OCUPADO por" app/src/main/assets/parkops-v1.6.2.js
          grep -q "Tarifa plena todo el día" app/src/main/assets/parkops-v1.6.2.js
          grep -q "Tarifa plena toda la noche" app/src/main/assets/parkops-v1.6.2.js
          grep -q "Por minutos" app/src/main/assets/parkops-v1.6.2.js
          grep -q "FACTURA ELECTRÓNICA" app/src/main/assets/parkops-v1.6.2.js
          grep -q 'versionName "1.6.2"' app/build.gradle
          ! grep -R -q 'BEGIN PRIVATE KEY' app web
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' app web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle assembleDebug --no-daemon
      - name: Verify compiled APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q "parkops-v1.6.2.js"
          unzip -p "$APK" assets/parkops-v1.5.1.js | grep -q "Bre-B"
          unzip -p "$APK" assets/parkops-v1.6.0.js | grep -q "LIQUIDAR PAGO · NO LIBERA CUPO"
          unzip -p "$APK" assets/parkops-v1.6.1.js | grep -q "GUARDAR CAPACIDADES"
          unzip -p "$APK" assets/parkops-v1.6.2.js | grep -q "N.º de parqueadero / espacio físico"
          unzip -p "$APK" assets/parkops-v1.6.2.js | grep -q "Tarifa plena todo el día"
          unzip -p "$APK" assets/parkops-v1.6.2.js | grep -q "Tarifa plena toda la noche"
          unzip -p "$APK" assets/parkops-v1.6.2.js | grep -q "FACTURA ELECTRÓNICA"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.6.2.apk
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.6.2.apk > release/PARKOPS-SOLVEX-LICENSED-v1.6.2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.6.2
          path: release/
          if-no-files-found: error
