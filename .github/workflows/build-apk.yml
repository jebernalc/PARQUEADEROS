name: Build PARKOPS Licensed APK v1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct authoritative app source
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > app/src/main/assets/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  app/src/main/assets/index.html" | sha256sum -c -
          test "$(wc -c < app/src/main/assets/index.html)" -eq 64455
          rm -f app/src/main/assets/qr_nequi.jpg

      - name: Validate app privacy and Supabase license gate
        shell: bash
        run: |
          grep -q "Registrar ingreso" app/src/main/assets/index.html
          grep -q 'id="celular"' app/src/main/assets/index.html
          grep -q "Recibo por WhatsApp" app/src/main/assets/index.html
          grep -q "id:'nequi'" app/src/main/assets/index.html
          ! grep -q '3114980095' app/src/main/assets/index.html
          ! grep -qi 'qr_nequi.jpg' app/src/main/assets/index.html
          grep -q "Activación PARKOPS" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "ANDROID_ID" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "activate_license" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q "functions/v1/parkops-master" app/src/main/java/com/solvex/parkops/MainActivity.java
          grep -q 'versionName "1.4.0"' app/build.gradle
          ! grep -R -q 'BEGIN PRIVATE KEY' app
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY' app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon

      - name: Verify compiled APK internals
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | sha256sum | grep -q '^ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407'
          ! unzip -Z1 "$APK" | grep -q 'assets/qr_nequi.jpg'
          ! unzip -p "$APK" assets/index.html | grep -q '3114980095'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PARKOPS-SOLVEX-LICENSED-v1.4.0.apk
          sha256sum release/PARKOPS-SOLVEX-LICENSED-v1.4.0.apk > release/PARKOPS-SOLVEX-LICENSED-v1.4.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-LICENSED-v1.4.0
          path: release/
          if-no-files-found: error
