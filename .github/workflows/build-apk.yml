name: Build PARKOPS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare PARKOPS React source
        run: cp README.md src/App.jsx

      - name: Install web dependencies
        run: npm install

      - name: Build PARKOPS web application
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R dist/. app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PARKOPS-SOLVEX-Android10-16.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PARKOPS-SOLVEX-APK
          path: PARKOPS-SOLVEX-Android10-16.apk
          if-no-files-found: error
