name: Publicar PARKSOLVEX Web v1.5.3 Cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/real-app/**"
      - "web/parkops-v1.5.1.js"
      - "web/browser-bridge.js"
      - "web/parkops-web-platform.js"
      - "web/manifest.webmanifest"
      - "web/sw.js"
      - "parksolvex-web/**"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir exactamente el núcleo oficial APK PARKOPS v1.5.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .web-build
          mkdir -p dist .web-build
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > .web-build/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  .web-build/index.html" | sha256sum -c -
          test "$(wc -c < .web-build/index.html)" -eq 64455
          cp web/parkops-v1.5.1.js .web-build/parkops-v1.5.1.js
          echo "d4b513841ff88e6f958c431fffc72825777fda4db89e90c3f1cfff77e0950818  .web-build/parkops-v1.5.1.js" | sha256sum -c -
          test "$(wc -c < .web-build/parkops-v1.5.1.js)" -eq 9114
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.web-build/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="parkops-v1.5.1.js"></script>'
          s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+tag
          p.write_text(s,encoding='utf-8')
          PY
          echo "2ae5261f8ceae9af99a3cf4cec7cea2d1c1254cb8a3a2323c667a0335589627e  .web-build/index.html" | sha256sum -c -
          test "$(wc -c < .web-build/index.html)" -eq 64497
      - name: Auditar funcionalidad exacta de APK antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          CORE=.web-build/index.html; EXT=.web-build/parkops-v1.5.1.js
          for x in 'Registrar ingreso' 'Entrada y enviar recibo' 'Entrada sin enviar recibo' 'Liquidar salida' 'En patio' 'Cierre de caja' 'Descargar CSV' 'Enviar cierre por WhatsApp' 'Conecta a recarga eléctrica' 'Recarga ilimitada en la mensualidad' 'Guardar reglas' 'Guardar datos' 'Guardar plantillas' 'Descargar respaldo' 'Restaurar respaldo' 'Borrar todos los datos' 'Registrar mensualidad' 'wa.me' 'pqe_cfg' 'pqe_tarifas' 'pqe_clientes' 'pqe_ingresos' 'pqe_mens'; do grep -q "$x" "$CORE"; done
          grep -q "id:'carro'" "$CORE"; grep -q "id:'moto'" "$CORE"; grep -q "id:'bicicleta'" "$CORE"; grep -q "id:'patineta'" "$CORE"
          grep -q 'tablaTarifas' "$CORE"; grep -q 'mediosPago' "$CORE"
          grep -q 'Bre-B' "$EXT"; grep -q 'Llave Bre-B' "$EXT"; grep -q 'probeInternet' "$EXT"; grep -q '● ONLINE' "$EXT"; grep -q '● OFFLINE' "$EXT"; grep -q "version:'1.5.3'" "$EXT"
          ! grep -q '3114980095' "$CORE"; ! grep -qi 'qr_nequi.jpg' "$CORE"
      - name: Adaptar núcleo APK a navegador con nube sin alterar UI
        shell: bash
        run: |
          set -euo pipefail
          cp .web-build/index.html dist/index.html
          cp .web-build/parkops-v1.5.1.js dist/parkops-v1.5.1.js
          cp web/browser-bridge.js dist/browser-bridge.js
          cp web/parkops-web-platform.js dist/parkops-web-platform.js
          cp parksolvex-web/web/cloud-sync.js dist/cloud-sync.js
          cp web/manifest.webmanifest dist/manifest.webmanifest
          cp web/sw.js dist/sw.js
          mkdir -p dist/admin
          cp -R parksolvex-web/admin/. dist/admin/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html');s=p.read_text(encoding='utf-8')
          head='<meta name="theme-color" content="#14171c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PARKSOLVEX"><link rel="manifest" href="./manifest.webmanifest">'
          s=s.replace('</head>',head+'\n</head>',1) if '</head>' in s else head+s
          scripts='<script src="./browser-bridge.js"></script><script src="./parkops-web-platform.js"></script><script src="./cloud-sync.js"></script>'
          s=s.replace('</body>',scripts+'\n</body>',1) if '</body>' in s else s+scripts
          p.write_text(s,encoding='utf-8')
          PY
          printf '%s\n' '{"product":"PARKSOLVEX WEB","webVersion":"1.5.3-web-cloud","apkCore":"1.5.3","source":"exact-apk-core+supabase-sync","admin":"/admin/","apkIndexSha256":"2ae5261f8ceae9af99a3cf4cec7cea2d1c1254cb8a3a2323c667a0335589627e"}' > dist/version.json
      - name: Validar cloud, licencias, usuarios y sedes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Activación PARKOPS Web' dist/parkops-web-platform.js
          grep -q "VERSION='1.5.3-web'" dist/parkops-web-platform.js
          grep -q 'AndroidDownload' dist/browser-bridge.js
          grep -q 'ParkSolvexCloud' dist/cloud-sync.js
          grep -q 'sync_push' dist/cloud-sync.js
          grep -q 'sync_pull' dist/cloud-sync.js
          grep -q 'PARKSOLVEX Admin' dist/admin/index.html
          grep -q 'parksolvex-admin' dist/admin/app.js
          grep -q "edge('bootstrap'" dist/admin/app.js
          grep -q "edge('invite_user'" dist/admin/app.js
          grep -q "edge('create_site'" dist/admin/app.js
          grep -q "edge('save_site_configuration'" dist/admin/app.js
          grep -q 'Sedes autorizadas' dist/admin/index.html
          grep -q 'Medios de pago' dist/admin/index.html
          grep -q 'parkops-web-v1.5.3-cloud-r3' dist/sw.js
          test -f dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar PARKSOLVEX Web
        id: deployment
        uses: actions/deploy-pages@v4
