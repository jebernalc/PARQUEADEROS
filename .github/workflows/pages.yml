name: Publicar PARKOPS Web Consoles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar configuración pública
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p dist
          cp -R web/. dist/
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('dist/config.js')
          s=p.read_text()
          s=s.replace('__SUPABASE_URL__',os.environ['SUPABASE_URL']).replace('__SUPABASE_ANON_KEY__',os.environ['SUPABASE_ANON_KEY'])
          p.write_text(s)
          PY
          else
            echo "::warning::Configure repository variables SUPABASE_URL and SUPABASE_ANON_KEY to enable login."
          fi
      - name: Validar portales
        run: |
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/owner/index.html
          grep -q "PARKOPS ADMIN" dist/admin/index.html
          grep -q "SOLVEX MASTER" dist/owner/index.html
          grep -q "owner_dashboard" dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
