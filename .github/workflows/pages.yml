name: Publicar PARKOPS Web v1.5.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/real-app/**"
      - "web/**"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir PARKOPS v1.5.1 Web desde la misma base Android
        shell: bash
        run: |
          mkdir -p dist
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > dist/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  dist/index.html" | sha256sum -c -
          test "$(wc -c < dist/index.html)" -eq 64455
          ! grep -q '3114980095' dist/index.html
          ! grep -qi 'qr_nequi.jpg' dist/index.html
          grep -q 'Registrar ingreso' dist/index.html
          grep -q 'id="celular"' dist/index.html
          grep -q 'Recibo por WhatsApp' dist/index.html

          # Misma capa funcional de la APK v1.5.1: Bre-B integrado y contingencia offline.
          cp web/parkops-v1.5.1.js dist/parkops-v1.5.1.js

          # Adaptadores exclusivos de navegador: compartir/descargar, licencia web y PWA.
          cp web/browser-bridge.js dist/browser-bridge.js
          cp web/parkops-web-platform.js dist/parkops-web-platform.js
          cp web/manifest.webmanifest dist/manifest.webmanifest
          cp web/sw.js dist/sw.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text(encoding='utf-8')
          head='''<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PARKOPS"><link rel="manifest" href="./manifest.webmanifest">'''
          if '</head>' in s:
              s=s.replace('</head>',head+'\n</head>',1)
          scripts='''<script src="./browser-bridge.js"></script><script src="./parkops-v1.5.1.js"></script><script src="./parkops-web-platform.js"></script>'''
          if '</body>' in s:
              s=s.replace('</body>',scripts+'\n</body>',1)
          else:
              s+=scripts
          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'parkops-v1.5.1.js' dist/index.html
          grep -q 'parkops-web-platform.js' dist/index.html
          grep -q 'browser-bridge.js' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'Bre-B' dist/parkops-v1.5.1.js
          grep -q 'CONTINGENCIA OFFLINE' dist/parkops-v1.5.1.js
          ! grep -q 'parkops-breb-btn' dist/parkops-v1.5.1.js
          grep -q 'Activación PARKOPS Web' dist/parkops-web-platform.js
          grep -q 'WEB-' dist/parkops-web-platform.js
          grep -q 'serviceWorker' dist/parkops-web-platform.js

          # Herramientas administrativas web existentes permanecen separadas.
          if [ -d web/admin ]; then mkdir -p dist/admin && cp -R web/admin/. dist/admin/; fi
          if [ -d web/owner ]; then mkdir -p dist/owner && cp -R web/owner/. dist/owner/; fi
          for f in web/app.js web/styles.css web/config.js; do [ -f "$f" ] && cp "$f" dist/; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
