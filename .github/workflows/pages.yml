name: Publicar PARKOPS Real Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/real-app/**"
      - "web/**"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir aplicación web autoritativa
        shell: bash
        run: |
          mkdir -p dist
          cat source/real-app/index.html.gz.b64.* | base64 --decode | gzip -dc > dist/index.html
          echo "ca465ce85dcdd084aee889972e931716366ae8402ac48e1f562a05e709d26407  dist/index.html" | sha256sum -c -
          test "$(wc -c < dist/index.html)" -eq 64455
          ! grep -q '3114980095' dist/index.html
          ! grep -qi 'qr_nequi.jpg' dist/index.html
          ! grep -qi 'QR Nequi' dist/index.html
          grep -q 'Registrar ingreso' dist/index.html
          grep -q 'id="celular"' dist/index.html
          grep -q 'Recibo por WhatsApp' dist/index.html

          # Capa operativa: cero impresoras, recibos digitales WhatsApp y configuración.
          cp web/digital-receipts.js dist/digital-receipts.js
          sed -i 's#</body>#<script src="./digital-receipts.js"></script></body>#' dist/index.html
          grep -q 'digital-receipts.js' dist/index.html

          if [ -d web/admin ]; then mkdir -p dist/admin && cp -R web/admin/. dist/admin/; fi
          if [ -d web/owner ]; then mkdir -p dist/owner && cp -R web/owner/. dist/owner/; fi
          for f in web/app.js web/styles.css web/config.js; do [ -f "$f" ] && cp "$f" dist/; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
